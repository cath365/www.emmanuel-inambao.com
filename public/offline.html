<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Emmanuel Inambao</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #020617;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 2rem;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.1);
      border: 2px solid rgba(59, 130, 246, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 1rem; color: #fff; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem; background: #2563eb; color: white;
      border: none; border-radius: 0.5rem; font-size: 1rem;
      cursor: pointer; transition: background 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: #1d4ed8; }
    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon pulse">&#9889;</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Don't worry — cached content is still available.
      Check your connection and try again.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>
  </div>
</body>
</html>
