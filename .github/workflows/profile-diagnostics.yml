name: Professional Profile Diagnostics

on:
  push:
    branches:
      - professional-profile-rebuild-sep-2026

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Format
        continue-on-error: true
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee format.log
      - name: Build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SITE_URL: https://emmanuelinambao.com
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-profile-diagnostics
          path: |
            lint.log
            format.log
            build.log
          if-no-files-found: ignore
          retention-days: 2
