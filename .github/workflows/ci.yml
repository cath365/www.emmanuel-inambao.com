name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint > lint-output.txt 2>&1

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check > format-output.txt 2>&1

      - name: Build project
        id: build
        continue-on-error: true
        run: npm run build > build-output.txt 2>&1
        env:
          NEXT_PUBLIC_SITE_URL: https://emmanuelinambao.com

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            lint-output.txt
            format-output.txt
            build-output.txt
          retention-days: 1

      - name: Enforce quality gates
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "One or more quality gates failed."
          exit 1

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
