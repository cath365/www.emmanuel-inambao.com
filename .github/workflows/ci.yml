name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          mkdir -p .ci-diagnostics
          set -o pipefail
          npm ci --legacy-peer-deps 2>&1 | tee .ci-diagnostics/install.log

      - name: Install compatible lint tools
        run: |
          set -o pipefail
          npm install --no-save --legacy-peer-deps eslint@8.57.1 eslint-config-next@14.2.35 2>&1 | tee .ci-diagnostics/lint-install.log

      - name: Run ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .ci-diagnostics/lint.log

      - name: Check formatting (legacy style debt, advisory)
        run: npm run format:check
        continue-on-error: true

      - name: Test CMS contracts
        run: node --test tests/admin-cms-contract.test.cjs

      - name: TypeScript check
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee .ci-diagnostics/typescript.log

      - name: Build project
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .ci-diagnostics/build.log
        env:
          NEXT_PUBLIC_SITE_URL: https://emmanuelinambao.com

      - name: Save CI diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ci-diagnostics
          path: .ci-diagnostics/
          retention-days: 2
          if-no-files-found: ignore

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
